<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="rating" content="adult">
  <meta name="robots" content="noindex, nofollow">
  <title>Watch — Tubeflux</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="age-gate" class="hidden">
  <div class="box">
    <h1>Tubeflux</h1>
    <p>This site contains sexually explicit material intended for adults only. You must be 18 years or older to enter.</p>
    <div class="actions">
      <button class="btn primary" id="gate-enter">I am 18 or older — Enter</button>
      <a class="btn" href="https://www.google.com">Leave</a>
    </div>
  </div>
</div>

<header class="site-header">
  <div class="container header-inner">
    <a class="logo" href="/">Tube<span>flux</span></a>
    <form class="search-form" id="search-form">
      <input type="search" id="search-input" placeholder="Search videos, tags, performers…" autocomplete="off">
      <button type="submit">Search</button>
    </form>
    <nav class="header-links">
      <a href="/">Home</a>
      <a href="/admin.html">Admin</a>
    </nav>
  </div>
</header>

<main class="container watch">
  <div class="player-wrap">
    <video id="player" controls playsinline preload="metadata"></video>
  </div>

  <h1 class="watch-title" id="v-title">Loading…</h1>
  <div class="watch-bar">
    <span id="v-views">— views</span>
    <button class="btn" id="like-btn">♥ Like <span id="v-likes"></span></button>
    <span id="v-cat"></span>
    <span id="v-date"></span>
  </div>

  <div class="chips" id="v-tags"></div>
  <p class="watch-desc" id="v-desc"></p>

  <h2 class="section-title">Comments</h2>
  <form class="comment-form" id="comment-form">
    <input id="c-author" placeholder="Your name (optional)" maxlength="40">
    <textarea id="c-body" placeholder="Say something…" maxlength="2000" required></textarea>
    <button type="submit">Post comment</button>
  </form>
  <div class="comments" id="comments"></div>

  <h2 class="section-title">Related videos</h2>
  <div class="grid" id="related"></div>
</main>

<div class="toast" id="toast"></div>
<script src="/js/app.js"></script>
<script src="/js/watch.js"></script>
</body>
</html>
